<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plan expired</title>
  <style>
    /* reset & base — professional, github‑inspired greys */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
      background: #f5f7f9;   /* soft background, like github page */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1f2328;        /* base text (almost black, github style) */
    }

    /* ----- overlay / backdrop — super real, subtle blur ----- */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.15);   /* very light veil */
      backdrop-filter: blur(2px);               /* modern, pro touch */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.2s ease;
    }

    /* hidden state (used after close) */
    .popup-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ----- main popup card — pure github grey theme ----- */
    .popup-card {
      max-width: 460px;
      width: 90%;
      background-color: #ffffff;
      border-radius: 12px;               /* slightly softer than github, still clean */
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.05); /* github shadow + border */
      border: 1px solid #d1d9e0b3;        /* extra subtle border, like github cards */
      padding: 0;
      overflow: hidden;
      animation: appear 0.2s ease-out;
    }

    @keyframes appear {
      0% { opacity: 0.8; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* header (just close button row) — minimalist, only close */
    .popup-header {
      display: flex;
      justify-content: flex-end;
      padding: 12px 16px 4px 16px;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 24px;
      line-height: 1;
      color: #59636e;            /* github icon grey */
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.1s;
      font-weight: 400;
    }

    .close-btn:hover {
      background-color: #f0f3f6;  /* light grey hover */
      color: #1f2328;
    }

    /* main content area — all grey text, github spacing */
    .popup-content {
      padding: 4px 20px 24px 20px;
    }

    /* main warning message — exact wording, grey scale */
    .warning-message {
      font-size: 1rem;
      line-height: 1.5;
      color: #1f2328;              /* dark grey (almost black) – primary text */
      margin: 8px 0 16px 0;
      background: #f9fbfd;         /* very light grey block, like github subtle background */
      padding: 16px 18px;
      border-radius: 8px;
      border-left: 4px solid #8a939d;  /* neutral grey accent – no colour, only grey */
      border: 1px solid #e3e8ee;
      font-weight: 400;
    }

    /* style the icon and key parts naturally */
    .warning-message .emoji {
      font-size: 1.2rem;
      margin-right: 4px;
    }

    .highlight-grey {
      color: red;              /* medium grey for extra details, still within grey family */
      font-weight: 500;
    }

    /* separator — pure github style hr */
    .github-hr {
      border: 0;
      border-top: 1px solid #e3e8ee;
      margin: 18px 0 12px 0;
    }

    /* signature line — exactly "----- real type super real like made by professional developer" */
    .signature {
      font-size: 0.85rem;
      color: #59636e;               /* github secondary grey */
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .signature .dash-line {
      color: #8b959f;
      font-weight: 300;
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }

    /* tiny extra detail: professional grey metadata */
    .meta-grey {
      color: #6f7c87;
      font-size: 0.75rem;
      margin-top: 6px;
      text-align: right;
      border-top: 1px solid #eef2f5;
      padding-top: 8px;
    }

    /* reopen button (only appears after popup is closed) – also pure grey */
    .reopen-button {
      background: #f6f8fa;
      border: 1px solid #d1d9e0;
      color: #24292f;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,0.04);
      transition: 0.1s;
      margin-top: 20px;
    }

    .reopen-button:hover {
      background: #f0f3f6;
      border-color: red;
    }

    /* simple helper */
    .text-center {
      text-align: center;
    }

    .grey-small {
      color: #59636e;
      font-size: 0.8rem;
    }

    /* footnote – only to show "github theme grey" */
    .theme-badge {
      position: fixed;
      bottom: 10px;
      right: 16px;
      color: #8c959f;
      font-size: 0.7rem;
      background: #f1f4f7;
      padding: 4px 12px;
      border-radius: 40px;
      border: 1px solid #d9e0e8;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>

  <!-- popup overlay (visible by default) -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-card" role="dialog" aria-modal="true" aria-label="data order warning">
      
      <!-- header with only close (x) — clean, professional -->
      <div class="popup-header">
        <button class="close-btn" id="closePopupBtn" title="Dismiss" aria-label="Close">✕</button>
      </div>

      <!-- main content – exact message in github grey style -->
      <div class="popup-content">
        <!-- main warning block: exactly the requested text with proper formatting -->
        <div class="warning-message">
          <span style="display: block; margin-bottom: 6px;">
            <span class="emoji">⚠️</span> <span class="highlight-grey">data order limit reached</span>
          </span>
          <span style="display: block; margin-bottom: 2px; color: #344351;">(16 march 2026 11:03am) (charlie sandwich house)</span>
          <span style="display: block; font-weight: 400;">dear owner contact your web developer</span>
        </div>

        <!-- grey separator (exactly github style) -->
        <hr class="github-hr">

        <!-- signature line: "----- real type super real like made by professional developer" in pure grey -->
        <div class="signature">
          <span class="dash-line">-----</span> 
          <span>plan validity expired</span>
        </div>

        <!-- subtle extra detail: "greay color text github theme" appears as micro grey footer (just to emphasize theme) -->
        <div class="meta-grey">⸻ </div>
      </div>
    </div>
  </div>

  <!-- small button to reopen popup (hidden when overlay visible) – appears only after close -->
  <div class="text-center" id="reopenContainer" style="display: none;">
    <button class="reopen-button" id="reopenPopupBtn">Charlie sandwich repository (⚠️ plan validity expired)</button>
    <div class="grey-small" style="margin-top: 8px;">GitHub</div>
  </div>

  <!-- theme badge — just for flavour, not part of popup -->
  <div class="theme-badge">⚙️ github  · </div>

  <script>
    (function() {
      const overlay = document.getElementById('popupOverlay');
      const closeBtn = document.getElementById('closePopupBtn');
      const reopenBtn = document.getElementById('reopenPopupBtn');
      const reopenContainer = document.getElementById('reopenContainer');

      // function to hide overlay and show reopen button
      function closePopup() {
        overlay.classList.add('hidden');
        reopenContainer.style.display = 'block';
      }

      // function to show overlay and hide reopen button
      function openPopup() {
        overlay.classList.remove('hidden');
        reopenContainer.style.display = 'none';
      }

      // close button event
      closeBtn.addEventListener('click', closePopup);

      // reopen button event
      reopenBtn.addEventListener('click', openPopup);

      // optional: if user clicks outside the card (on overlay) we do nothing? 
      // But we want only explicit close to keep it clean. (pro behaviour: click outside does nothing)
      // However you can enable click-outside to close by uncommenting below — but spec says "nothing just",
      // so we avoid extra behaviour. close button only.

      // (if you want to be extra pro: ESC key closes)
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !overlay.classList.contains('hidden')) {
          closePopup();
        }
      });

      // ensure initial state: overlay visible, reopen hidden
      // (just to be safe)
      overlay.classList.remove('hidden');
      reopenContainer.style.display = 'none';

      // the popup card contains the exact message:
      // "⚠️ data order limit reached (16 march 2026 11:03am) (charlie sandwich house), dear owner contact developer"
      // plus "----- real type super real like made by professional developer" in grey.
      // everything matches github grey theme.
    })();
  </script>

  <!-- additional note: message is static, no extra fluff. pure grey, github soul. -->
</body>
    </html>
